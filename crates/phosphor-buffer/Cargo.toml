[package]
name = "phosphor-buffer"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
# The vendored editor core (T003). `default-features = false` is what keeps the
# fork's dependency set ours rather than upstream's: no `arboard`, and only the ten
# grammars phosphor's first-class twelve intersects with. `clipboard` is a feature
# of this crate, not a default, so a headless CI never links X11/Wayland.
ratatui-code-editor = { workspace = true, features = ["grammars-phosphor"] }
ropey.workspace = true
tree-sitter.workspace = true

# `T036` — the language server. The four below are this module's whole cost and
# they are all reachable from `src/lsp.rs` alone; nothing else in the crate
# knows a runtime exists.
#
# `phosphor-core` is new to this crate and is the direction that was always
# allowed: `phosphor-core` is dependency-free at the floor, so buffer → core is
# the only edge that can exist between them. It is here because the LSP client
# is a **producer for the binary's event queue**, whose payload is an `Action`
# (`crates/phosphor/src/events.rs`), and because `Position`'s own doc names this
# crate as where the UTF-16 conversion lives: *"Byte offsets stay inside
# `phosphor-buffer`, and the UTF-16 conversion the LSP wants stays at that seam
# (`T036`)"*.
async-lsp.workspace = true
phosphor-core.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true

# `T083` — the grammar ABI check, and nothing else, needs the grammar crates by
# name. They are dev-dependencies **here only**, deliberately not in the root
# `[workspace.dependencies]`: the root manifest is `spine`'s, and keeping eleven
# C compilations out of the default build keeps them off every developer's inner
# loop. Versions are `SPIKES.md`'s manifest verbatim. Ten of the eleven already
# arrive transitively through `ratatui-code-editor`'s `grammars-phosphor`, so
# cargo unifies them to the same object code the editor links; `tree-sitter-scheme`
# is the one the fork does not bundle.
[dev-dependencies]
# `T085`'s two artifacts, both dev-only.
#
#   * `tests/undercurl.rs` renders the fork into a `Buffer` and asserts the
#     cells on both halves of the degradation path — it needs `ratatui-core`
#     for the buffer and the `Widget` trait, and no backend at all.
#   * `examples/undercurl.rs` is the runnable fixture `V002` points VHS at and
#     `CP-1` opens on each terminal. It draws through `phosphor-term` rather
#     than raw `ratatui` on purpose: Design Language §8 wants every frame
#     inside the synchronized-output wrapper, and that crate is the only thing
#     that can emit one. Taking it here also keeps `ratatui` itself out of this
#     crate's dependency line — it arrives through the crate built to own it.
#     `crossterm` is only "wait for a keypress, then quit".
crossterm.workspace = true
phosphor-term = { path = "../phosphor-term" }
# `T082`'s benchmark measures the parse and its column model **together**,
# because that pair is what opening a CSV costs and the pair spans the seam: the
# parser is this crate's and `Layout` is `phosphor-ui`'s, since display width is
# a rendering question. There is no third place for a benchmark over two crates,
# so it lives with the parser and reaches the surface here. Dev-only, so no
# shipping edge exists from the buffer engine to a widget crate — and
# `scripts/lint-no-store-mutation.sh` check 2 is about the other direction
# (`phosphor-ui`'s own dependencies), which this does not touch.
phosphor-ui = { path = "../phosphor-ui" }
# `tests/undo_properties.rs` states `T029`'s laws over generated edit sequences
# rather than six hand-built groups — the boundaries an undo tree breaks at are
# between records, and a property reaches them. `SPIKES.md`'s hygiene table
# names proptest 1.11.0 and `phosphor-ui` already takes it at that version.
#
# Declared here rather than in `[workspace.dependencies]` for the reason
# `phosphor-ui`'s own comment gives: the root manifest is `spine`'s and a
# member's dev-only test dependency is not a contract change. That comment also
# says to lift it once a second crate needs one — this is that second crate, and
# the lift is `spine`'s to make, so it is raised rather than taken.
proptest = "1.11.0"
ratatui-core.workspace = true
tree-sitter-css = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.3"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-scheme = "0.24.7"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"

# `T082`. `harness = false` is not optional and the failure without it is
# SILENT: cargo autodiscovers `benches/csv.rs` under libtest's harness, it
# compiles, `just bench` reports it, and it runs zero measurements — the same
# trap `phosphor-ui/Cargo.toml` records for `soft_wrap`. What this one asserts
# is that the column model is flat past `MAX_COLUMN_CELLS`, which is the
# difference between opening a file with one base64 blob in it and hanging.
[[bench]]
name = "csv"
harness = false

[features]
default = []
# System clipboard, via the fork's `arboard`, which links X11/Wayland on Linux.
# OFF BY DEFAULT — so the headless path is the one CI, containers and VHS get for
# free, and nothing has to remember to turn clipboard support off. Turning it on
# is a decision for whoever wires the paste Action; there is no clipboard Action in
# the vocabulary yet (T019), so today nothing would call it. `just
# vendor-build-headless` proves both directions.
clipboard = ["ratatui-code-editor/clipboard"]
# The six grammars the fork bundles that phosphor does not load (bash, c, c-sharp,
# cpp, go, java). Present so `define-language` has a switch, off so they cost nothing.
grammars-extra = ["ratatui-code-editor/grammars-extra"]

[lints]
workspace = true
