[package]
name = "phosphor"
default-run = "phosphor"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

# The only crate that may depend on `ratatui` itself: the app layer owns the
# terminal, the frame and the event loop. Widgets stay on `ratatui-core`.
[dependencies]
clap.workspace = true
crossterm.workspace = true
# `T045`'s matcher. Helix's engine, MPL-2.0, allowed at `deny.toml:54`.
#
# **In the binary and not in `phosphor-ui`**, and that is the architecture
# rather than a preference: `nucleo` owns a thread pool, and a widget crate that
# spawned threads would be a widget that outlives a frame. `phosphor-ui` draws a
# `PickerVm`; this crate is what fills one.
#
# `default-features = false` drops `parking_lot`'s dependency on `std`-adjacent
# extras we do not use. Pinned at `SPIKES.md`'s manifest version, verified by
# resolving and building it in the pre-window scout: no new `ratatui-core`
# enters the graph, which is what `deny.toml`'s `deny-multiple-versions` on that
# crate would otherwise catch.
nucleo = "0.5.0"
phosphor-agent.workspace = true
phosphor-buffer.workspace = true
serde_json.workspace = true
tokio.workspace = true
phosphor-core.workspace = true
phosphor-steel.workspace = true
phosphor-term.workspace = true
phosphor-ui.workspace = true
phosphor-vcs.workspace = true
ratatui.workspace = true
# T026 turned the fork's `crossterm` feature back off. It was on for exactly one
# reason — `editor_crossterm`, the vendored core's own key/mouse handler, which
# `T090` rode as S1's temporary input path — and the input machine replaced it
# outright rather than wrapping it (TASKS.md's T026 note; `main.rs`'s header).
# Nothing in this binary reads an event through the fork any more, and the build
# is what proves it: with the feature off, a surviving `Editor::input` call does
# not compile.
#
# The dependency itself stays, for **one** name the binary still uses:
# `Selection`, which `SelectRange` sets. The fork's `Undo`/`Redo` were the other
# one and the wiring pass took them — `T029`'s tree is the history now, and two
# live histories cannot both be it (`main.rs`'s `Timeline`). Default-features-off
# code, so this is the same edge every other consumer has.
ratatui-code-editor.workspace = true

# `tests/screen_6b.rs` — the Tier-1 golden frame for `6b`, which needs
# `phosphor-steel` (composes the tree) and `phosphor-ui` (draws it) at once.
# This is the only crate that has both: `scripts/lint-no-store-mutation.sh`
# check 2 allows `phosphor-ui` exactly one `phosphor-*` dependency, so the
# frame cannot live beside the `CP-1` ones in `phosphor-ui/tests/`.
#
# `insta` matches the version `phosphor-ui` pins, so `cargo insta review`
# behaves the same in both. `ratatui-core` is what `T018`'s serialiser is
# written against; it is already in the tree through `phosphor-ui`, so this
# adds an edge and not a crate.
[dev-dependencies]
insta = { version = "1.48.0", default-features = false }
# `src/events.rs` — the one event queue. Its rule is a *property* over
# interleavings, not a set of examples: whatever order producers post in, every
# event that is not a resize is delivered exactly once and in order, and a
# resize is dropped only when something arrived after it. Four examples cover
# the drag `§22` names; the law is what says no *other* interleaving loses a
# keystroke or a server message.
#
# 1.11.0 is the version `phosphor-core`, `phosphor-buffer` and `phosphor-ui`
# already pin, so this adds an edge and not a crate. Declared here rather than
# in `[workspace.dependencies]` for the reason `phosphor-ui`'s own entry gives:
# a member's dev-only test dependency is that crate's business, and the root
# manifest is `spine`'s. Lift it if the fourth of these ever makes the case.
proptest = "1.11.0"
ratatui-core.workspace = true

# `benches/vm_invocations.rs` (T091) drives the shipping binary on a
# pseudoterminal, which needs `openpt`/`grantpt`/`unlockpt`/`ptsname` and a
# `TIOCSWINSZ`. `rustix` is the safe wrapper for all five and is already in the
# tree — `crossterm` builds on it — so this turns two of its features on rather
# than adding a crate. Safe matters here: the workspace denies `unsafe_code`
# and a benchmark is not a reason to make an exception.
#
# Target-gated because a pty is a unix object; the bench's non-unix `main`
# prints that it was skipped. Not in the workspace table: nothing else needs it
# and `[workspace.dependencies]` is the shared floor, not a dumping ground.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.4", features = ["pty", "termios"] }

# T091's measurement, alongside T079's. Same shape as that one — `harness =
# false`, no libtest, no criterion, it prints the numbers it asserts — and the
# same standing rule: `just bench` runs it, `just gate` does not, because a
# number that moves with the machine has no business failing a build. What it
# asserts is the structural half (flat versus climbing), which does not.
[[bench]]
harness = false
name = "vm_invocations"

[lints]
workspace = true
