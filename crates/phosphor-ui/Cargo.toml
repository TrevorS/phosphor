[package]
name = "phosphor-ui"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

# `ratatui-core` only — never `ratatui`. This is the whole point of the pin (T002):
# one ratatui major in the tree, and a widget crate that cannot reach the app layer.
[dependencies]
phosphor-core.workspace = true
ratatui-core.workspace = true
# The vendored editor core (T003), which `BufferView` composes around: it owns
# text, highlighting, cursor and selection, and phosphor's layer wraps it with
# the 3-column contract (Component Breakdown, `BufferView`). Taken here rather
# than through `phosphor-buffer` because a UI crate's only `phosphor-*`
# dependency may be `phosphor-core` — `scripts/lint-no-store-mutation.sh` check 2
# — and this is a third-party widget crate, not a mutation path.
#
# The workspace entry (root `Cargo.toml`) carries `default-features = false`,
# so what this crate asks for is the fork with no grammars, no `crossterm` and
# no `arboard` — and asking is all a manifest can do. **Cargo unifies features
# per crate across the graph**: there is one instance of the crate in the build,
# so any dependent turning a feature on turns it on here too.
#
# It asks and it gets, as of this session. `T090`'s host did turn `crossterm`
# on, to ride the fork's `editor_crossterm` handler as S1's temporary input
# path, and this paragraph used to record that; `T026` replaced that path with
# the input machine and turned the feature back off
# (`crates/phosphor/Cargo.toml:22-33`). Verify it rather than trusting this
# comment — the manifest cannot state it and no lint checks it:
#
#     cargo tree --workspace -e features,dev,build,normal \
#       | grep 'ratatui-code-editor feature'
#
# Neither `"crossterm"` nor `"clipboard"` appears there today, and `arboard` is
# absent from the graph entirely.
#
# What holds either way, so that a dependent turning `crossterm` back on is a
# regression to fix and not a breach of an invariant:
#   * `T003`'s headless guarantee does not rest on this. `arboard` sits behind
#     its own feature nobody enables, and `just vendor-build-headless` proves
#     both directions.
#   * "A widget cannot reach the app layer" is enforced at the source by
#     `scripts/lint-no-app-layer-in-ui.sh`, which fails on `editor_crossterm`
#     by name, because Cargo has no way to scope a feature to one dependent.
#     Same shape as the store rule: the type system can't say it, so a lint does.
ratatui-code-editor.workspace = true
# The vendored markdown renderer (T004), for the transcript's prose body at S6.
# OPTIONAL AND OFF BY DEFAULT, for two reasons:
#   * Q4's guardrail — the transcript must render with the gate on and off, so the
#     plain-text path stays the fallback and a broken bump degrades one surface
#     instead of breaking the build.
#   * The rule above. This crate is `ratatui-core`-only in every default build;
#     `ratatui-markdown` depends on full `ratatui`, so enabling `markdown` puts
#     `ratatui` 0.30 in this crate's tree. Same major as the pin — `cargo tree`
#     still shows one ratatui — but it is a real relaxation of the ratatui-core
#     rule and is flagged to `spine` rather than assumed.
ratatui-markdown = { workspace = true, optional = true, features = ["markdown"] }

# T017's statusline invariant is a *property*, not a set of examples: no width
# from 40 to 200, with any ViewModel, may produce a second row. SPIKES.md's
# hygiene table names proptest 1.11.0 for exactly this task.
#
# Declared here rather than in `[workspace.dependencies]` deliberately: the root
# manifest is `spine`'s (TEAM.md, settled at CP-0) and a member's own dev-only
# test dependency is not a contract change. Lift it to the root if a second
# crate ever needs it — one version in one place is the rule that matters.
[dev-dependencies]
# T018's Tier-1 golden frames. SPIKES.md's hygiene table names it for exactly
# this — "purpose-built, with review tooling for intentional changes", which is
# `cargo insta review`. Declared here for the same reason `proptest` is: a
# member's dev-only test dependency is that crate's own business, and the root
# manifest is `spine`'s.
#
# `default-features = false` drops `similar`, `console` and the colour-diff
# stack: this crate commits plain-text snapshots and never needs a prettier
# diff than `cargo insta` itself prints. Lift it to the root if a second crate
# ever takes it.
insta = { version = "1.48.0", default-features = false }
proptest = "1.11.0"
# T015's tests assert that tree-sitter highlighting actually reaches the cells,
# which needs a grammar. Rust only, and dev-only: every mockup CP-1 checks is a
# Rust slice, and a widget crate has no business linking eleven C grammars into
# its own lib build. In a workspace build cargo unifies this with
# `phosphor-buffer`'s `grammars-phosphor`, so it costs nothing there.
ratatui-code-editor = { workspace = true, features = ["grammar-rust"] }

# `T079`'s acceptance criterion is a benchmark, so it is a real target rather
# than a one-off script: `just bench` runs it and `just clippy` (which passes
# `--all-targets`) keeps it compiling.
#
# `harness = false` — no libtest. This is not a statistical microbenchmark and
# criterion would be a dependency for nothing: the measurement is two counters
# (composer invocations, frames) over a simulated clock, and the interesting
# number is their ratio, not a confidence interval.
[[bench]]
name = "frame_cache"
harness = false

# `harness = false` is not optional here, and the failure is silent. Without this
# pair cargo autodiscovers `benches/soft_wrap.rs` under libtest's harness: it
# compiles green, `just bench` reports it, and it runs zero measurements. The
# benchmark that found the 5.7-second resize would have said nothing.
[[bench]]
name = "soft_wrap"
harness = false

[features]
default = []
# Rich markdown in the transcript. Per-language highlight features stay off:
# `ratatui-markdown`'s `highlight-lang-*` set is 37 grammars wide and every one
# enabled is more surface to keep compiling across the 0.29 -> 0.30 bump.
markdown = ["dep:ratatui-markdown"]

[lints]
workspace = true
