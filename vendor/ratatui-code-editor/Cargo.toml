[workspace]
members = [
    ".",
    "examples/minimal",
    "examples/editor",
    "examples/editor_nl",
    "examples/half",
    "examples/split",
    "examples/marks",
    "examples/lsp",
    "examples/diff",
    "examples/diff_editor",
    "examples/fold_editor",
]

[package]
name = "ratatui-code-editor"
version = "0.0.6"
edition = "2024"
authors = ["vipmax"]
description = "ratatui-code-editor is A code editor widget for ratatui, built with syntax highlighting powered by Tree-sitter."
license = "MIT"
readme = "README.md"
homepage = "https://github.com/vipmax/ratatui-code-editor"
repository = "https://github.com/vipmax/ratatui-code-editor.git"
keywords = ["ratatui", "terminal", "editor", "tree-sitter"]
categories = ["command-line-interface", "text-editors"]
exclude = [".anycode/*", "Cargo.toml.orig"]


[workspace.dependencies]
anyhow = "^1.0"
crossterm = "~0.29"
ratatui = "~0.30"
ratatui-code-editor = { path = "." }

[dependencies]
anyhow = "^1.0"
# PHOSPHOR PATCH 5 — was `~0.1.0`. `CellDiffOption::ForcedWidth`, which keeps an
# escape-carrying cell one column wide, landed in 0.1.2. See VENDOR.md.
ratatui-core = "~0.1.2"
crossterm = { version = "~0.29", optional = true }
ropey = "^1.6"
rust-embed = { version = "^8.7", features = ["include-exclude"] }
streaming-iterator = "~0.1"
tree-sitter = "~0.26"
tree-sitter-javascript = { version = "~0.25", optional = true }
tree-sitter-rust = { version = "~0.24", optional = true }
tree-sitter-typescript = { version = "~0.23", optional = true }
unicode-width = "~0.2"
unicode-segmentation = "^1.12"
arboard = { version = "^3.5", default-features = false, optional = true }
similar = "^2.7"
tree-sitter-python = { version = "~0.25", optional = true }
tree-sitter-go = { version = "~0.25", optional = true }
tree-sitter-java = { version = "~0.23.5", optional = true }
tree-sitter-c = { version = "~0.24.1", optional = true }
tree-sitter-cpp = { version = "~0.23.4", optional = true }
tree-sitter-html = { version = "~0.23.2", optional = true }
tree-sitter-css = { version = "~0.25", optional = true }
tree-sitter-c-sharp = { version = "~0.23.1", optional = true }
tree-sitter-yaml = { version = "~0.7", optional = true }
tree-sitter-json = { version = "~0.24.8", optional = true }
tree-sitter-toml-ng = { version = "~0.7.0", optional = true }
tree-sitter-bash = { version = "~0.25.0", optional = true }
tree-sitter-md = { version = "~0.5.1", optional = true }

[dev-dependencies]
criterion = "0.5"
ratatui = { workspace = true }

[[bench]]
name = "diff"
harness = false
required-features = ["bench-internals"]

[features]
# PHOSPHOR PATCH 2 + 3 — see VENDOR.md. Upstream has no feature gates here:
# all 16 grammars and `arboard` are hard dependencies. `default` below reproduces
# upstream's dependency set exactly, so a standalone `cargo build` in this
# directory behaves as it did before the fork; phosphor consumes the crate with
# `default-features = false` and picks `grammars-phosphor` (+ `clipboard` where a
# clipboard exists). Upstreamable as-is.
default = ["crossterm", "clipboard", "grammars-all"]
bench-internals = []
crossterm = [
    "dep:crossterm"
]

# System clipboard via `arboard`, which links X11/Wayland on Linux. With the
# feature off, `Editor::{get,set}_clipboard` fall back to the in-editor
# `clipboard` field that already backs them when `arboard` fails at runtime —
# same behaviour a headless machine gets today, minus the link-time dependency.
clipboard = ["dep:arboard"]

# One feature per bundled grammar.
grammar-bash = ["dep:tree-sitter-bash"]
grammar-c = ["dep:tree-sitter-c"]
grammar-c-sharp = ["dep:tree-sitter-c-sharp"]
grammar-cpp = ["dep:tree-sitter-cpp"]
grammar-css = ["dep:tree-sitter-css"]
grammar-go = ["dep:tree-sitter-go"]
grammar-html = ["dep:tree-sitter-html"]
grammar-java = ["dep:tree-sitter-java"]
grammar-javascript = ["dep:tree-sitter-javascript"]
grammar-json = ["dep:tree-sitter-json"]
grammar-markdown = ["dep:tree-sitter-md"]
grammar-python = ["dep:tree-sitter-python"]
grammar-rust = ["dep:tree-sitter-rust"]
grammar-toml = ["dep:tree-sitter-toml-ng"]
grammar-typescript = ["dep:tree-sitter-typescript"]
grammar-yaml = ["dep:tree-sitter-yaml"]

# The intersection of what this crate bundles with phosphor's first-class twelve
# (SPIKES.md, "Grammars — the first-class twelve"). The two in that twelve the
# crate does not bundle are Steel (rides `tree-sitter-scheme`) and CSV
# (hand-written, T082); adding them here is S4's job, not this fork's.
grammars-phosphor = [
    "grammar-css",
    "grammar-html",
    "grammar-javascript",
    "grammar-json",
    "grammar-markdown",
    "grammar-python",
    "grammar-rust",
    "grammar-toml",
    "grammar-typescript",
    "grammar-yaml",
]

# The six phosphor never loads. Opt-in, and named so a future `define-language`
# entry has an obvious switch to flip.
grammars-extra = [
    "grammar-bash",
    "grammar-c",
    "grammar-c-sharp",
    "grammar-cpp",
    "grammar-go",
    "grammar-java",
]

grammars-all = ["grammars-phosphor", "grammars-extra"]
