[workspace]
members = ["crates/*"]
# The two vendored subtrees (T003, T004) are path dependencies but deliberately
# NOT members. A path dep inside the workspace dir is auto-promoted to a member
# unless excluded, and membership would put upstream code inside
# `cargo fmt --all --check` and `clippy --workspace -D warnings` — CI would then
# go red on code we did not write, and the fix would be to reformat the fork,
# which is exactly the divergence `just vendor-diff` exists to prevent.
# Excluded, they still build (as dependencies of `phosphor-buffer` / `phosphor-ui`)
# but our lints stop at the seam. `ratatui-code-editor` also carries its own
# `[workspace]` table for its examples, which would be a second workspace root.
#
# `fuzz` is excluded for the same reason at a different seam. It is a cargo-fuzz
# crate, so it needs nightly for `-Zsanitizer` while `rust-toolchain.toml` pins
# 1.97.1 for tape determinism — and a directory outside the workspace may carry
# its own `rust-toolchain.toml`, which `fuzz/` does. Excluding it also keeps a
# fuzz target out of `--workspace` builds: fuzzing is something a person runs
# deliberately, not a cost `just gate` pays on every invocation.
exclude = ["fuzz", "vendor/ratatui-code-editor", "vendor/ratatui-markdown"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
# Recorded here as well as in LICENSE-MIT and LICENSE-APACHE. Inert while every
# crate is `publish = false` — cargo only enforces it on a publish — but the
# manifest is the first place a reader looks for the answer, and `cargo deny`
# reads licences for a living.
license = "MIT OR Apache-2.0"
# The real floor, recomputed from the dependency graph rather than asserted.
#
# This read `1.85` — edition 2024's floor, and the fork's — from `T002` until the
# tooling pass checked it. It was false: `ratatui` 0.30.2 and the five crates
# that ship with it declare `rust-version = "1.88"`, as does `time` 0.3.55. A
# floor lower than a dependency's is not a floor, it is a claim nobody could
# build on, and nothing noticed because the toolchain is pinned to 1.97.1 for
# tape determinism and no one ever compiles at the floor.
#
# `scripts/lint-msrv.sh` recomputes this from `cargo metadata` now, so the next
# dependency that raises it fails CI instead of making this line wrong again.
rust-version = "1.88"
version = "0.1.0"

# The dependency floor (T002). Versions are SPIKES.md's manifest, verified 2026-08-11.
# Two rules this table exists to hold:
#   * `phosphor-ui` takes `ratatui-core` and never `ratatui`.
#   * `steel-core` is pinned exactly (Q5) — a patch bump is its own scheduled task.
[workspace.dependencies]
# `T036`'s language-server transport: JSON-RPC framing, request/response
# correlation and typed LSP payloads. SPIKES.md's transport table recommends it
# over `tower-lsp` (last released 2023) and over `lsp-types` alone.
#
# `default-features = false` drops three of the four defaults, and each one is a
# *server*-side facility this client has no use for:
#   * `client-monitor` — a server watching its client's pid, via `waitpid-any`
#     and `rustix`. We are the client and we own the child, so a dead server is
#     an EOF on a pipe we hold.
#   * `stdio` — `PipeStdin`/`PipeStdout` for a server reading its own stdin.
#     Phosphor's stdin is a terminal in raw mode; the pipes we read are the
#     child's, through `tokio::process`.
#   * `tracing` — this crate emits none, and the subscriber is the binary's.
# What stays is `omni-trait`, which is the `LanguageServer` trait that turns
# `initialize`/`did_open`/`definition` into typed method calls rather than
# hand-built `serde_json::Value`s.
#
# **The recommendation's stated reason does not survive reading the manifest,
# and the choice does.** SPIKES.md prefers this over "`lsp-types` alone
# (2024-06)", but `async-lsp` 0.2.4 *depends on* `lsp-types` 0.95 and
# re-exports it as `async_lsp::lsp_types`, so the types arrive either way and
# they are the same 2024 types (0.97.0, the newest, is also 2024-06-04 —
# `lsp-types` has not moved since). What `async-lsp` actually buys is the
# framing, the id correlation and the `Router`; that is the reason to take it,
# and it is worth taking rather than hand-rolling.
async-lsp = { version = "0.2.4", default-features = false, features = [
    "omni-trait",
] }
# `T050`'s session transport — the Agent Client Protocol, which is how an editor
# talks to Claude Code (SPIKES.md's manifest names 2.0.0, and this is it).
# Apache-2.0, and its `rust-version` is 1.88.0 — the workspace floor exactly, so
# it moves no MSRV.
#
# No features. Every one of the six is `unstable_*` and gates a schema
# extension — auth methods, elicitation, end-turn token usage, MCP-over-ACP,
# protocol v2, session fork — and this client speaks the stable protocol. A turn
# that completes needs none of them.
agent-client-protocol = { version = "2.0.0", default-features = false }
# `T052`'s MCP server — the agent's door, and the third of invariant 2's three.
# SPIKES.md's manifest names `rmcp`; 3.1.4 is what it resolves to and its
# `rust-version` is 1.88, the workspace floor exactly.
#
# `server` and `transport-io` only. The default set adds `macros`, which is the
# `#[tool]` attribute pair for a handful of hand-written tools — this door has
# 218 derived from the registry, so the macros would be dead weight and the
# `schemars` they pull would be a **second schema generator** beside
# `registry::mcp::tool`, which is exactly the drift `T020` exists to prevent.
rmcp = { version = "3.1.4", default-features = false, features = [
    "server",
    "transport-io",
] }
# The CLI door's argument parser (SPIKES.md's manifest, `phosphor --eval`).
# `T090` is its first consumer — `--theme <slug>` plus the file to open — and
# `T023` takes the same parser when `--eval` lands, which is why it is pinned
# here rather than in the binary's own manifest.
#
# `default-features = false` drops `color` and `suggestions`: the colour stack
# (anstream/anstyle-query/colorchoice) writes SGR to a terminal this program is
# about to take over, and `strsim`'s "did you mean" is not worth a dependency
# for a two-flag CLI. What stays is the parser, the derive macro, and legible
# errors.
#
# `string` is `T023`'s, and it is not optional there: the CLI door's 208 verbs
# are *built at runtime* by walking the registry, so every command name, flag
# name and value placeholder is an owned `String` rather than a literal. That
# feature is exactly the `impl From<String> for clap::{Str, Id}` pair, adds no
# dependency, and is what a derived door costs. Without it the alternative is
# leaking the registry's names to `&'static str`, which trades a feature flag
# for a memory leak.
clap = { version = "4.6.6", default-features = false, features = [
    "derive",
    "error-context",
    "help",
    "std",
    "string",
    "usage",
] }
crossterm = "0.29.0"
phosphor-agent = { path = "crates/phosphor-agent" }
phosphor-buffer = { path = "crates/phosphor-buffer" }
phosphor-core = { path = "crates/phosphor-core" }
phosphor-steel = { path = "crates/phosphor-steel" }
# T014's crate. Not in this table before T090 because nothing had drawn a frame
# yet; the binary is its first consumer and every later one (T026, T088) goes
# through the same `Term`.
phosphor-term = { path = "crates/phosphor-term" }
phosphor-ui = { path = "crates/phosphor-ui" }
phosphor-vcs = { path = "crates/phosphor-vcs" }
ratatui = "0.30.2"
# The two vendored forks (T003 / T004), consumed as path deps — not submodules and
# not `[patch.crates-io]` (plan §2). Provenance for each is in its own VENDOR.md.
ratatui-code-editor = { path = "vendor/ratatui-code-editor", default-features = false }
ratatui-core = "0.1.2"
# `T110`'s matcher. **Already compiled into this binary** — `tree-sitter` depends
# on it and every phosphor crate depends on `tree-sitter` — so naming it directly
# adds no crate to the graph, no licence to `cargo deny`, and does not move the
# MSRV. That is what decided the ruling recorded at `T110`: the argument for a
# literal-only `/` was *"nothing in this tree parses a regex"*, and the tree
# already links a regex engine.
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode"] }
ratatui-markdown = { path = "vendor/ratatui-markdown", default-features = false }
ropey = "1.6.1"
# `T036` **names a type** with it, and that is the whole of it: a language
# server's `initializationOptions` is free-form JSON the server, not us, gives
# meaning to, so `lsp_types::InitializeParams` types the field
# `Option<serde_json::Value>` and `ServerSpec` has to carry the same type to
# hand one through. The client builds no JSON of its own — `async-lsp`'s
# `omni-trait` is taken precisely so every request is a typed method call rather
# than a hand-built `Value`.
#
# This comment used to say "`T036` builds one value with it", which a review
# checked against the tree and found false — no constructor anywhere in the
# crate. Naming a type is a real reason for a dependency line and needed no
# embellishment; the *builder* it types is exercised by
# `lsp::tests::initialization_options_reach_the_server_or_are_absent`, so the
# door is reachable rather than merely declared.
#
# Already in the lock through `steel-core`, so this line adds a name rather than
# a build. SPIKES.md's manifest pins 1.0.151.
serde_json = "1.0.151"
steel-core = "=0.8.2"
steel-derive = "=0.8.2"
# `T036`'s runtime, and **the editor stays synchronous** — this is the one place
# a scheduler exists. `phosphor-buffer`'s LSP client owns a `new_current_thread`
# runtime on a thread of its own and posts finished work into the binary's one
# event queue (`crates/phosphor/src/events.rs`), which is `std::sync::mpsc` and
# knows nothing about any of this. Design Language's "no widget ever blocks" is
# what that shape buys: a server that hangs hangs its own thread.
#
# Six features, each with a caller: `process` spawns the server and
# `kill_on_drop`s it, `io-util` is the pipe traits `tokio-util`'s compat layer
# adapts, `rt` is the single-threaded scheduler, `sync` is the command channel
# into it, `time` is the readiness timeout that turns "hung" into `Crashed`
# rather than "starting forever", and `macros` is `select!`. No `net`, no
# `signal`, no multi-thread work-stealing pool.
tokio = { version = "1.53.1", default-features = false, features = [
    "io-util",
    "macros",
    "process",
    "rt",
    "sync",
    "time",
] }
# The seam between the two async worlds, and the reason it is a dependency at
# all: `async-lsp`'s main loop reads `futures::io::AsyncRead`, `tokio::process`
# hands out `tokio::io::AsyncRead`, and `compat` is the adapter. One feature,
# no runtime of its own.
tokio-util = { version = "0.7.19", default-features = false, features = [
    "compat",
] }
tree-sitter = "0.26"

# One lint configuration for all seven crates, inherited via `[lints] workspace = true`,
# rather than seven `#![warn(...)]` preambles that drift (SPIKES.md, hygiene).
# The T006 / T007 structural lints get their teeth here.
[workspace.lints.rust]
missing_debug_implementations = "warn"
# `missing_docs` is deliberately NOT here yet. It is right for this workspace —
# the doc comments are load-bearing — but `just clippy` runs `-D warnings`, so
# turning it on denies rather than warns, and there are 21 undocumented struct
# fields today: 19 in `phosphor-ui/src/theme/load.rs`'s error variants and 2 in
# `buffer_view.rs`. They are `surface`'s files and `surface` is live in Window D.
# Sized here so it is a known piece of work rather than a discovery.
unreachable_pub = "warn"
unsafe_code = "deny"
unused_qualifications = "warn"

# Intra-doc links are how this codebase cross-references itself: `action.rs`'s
# header alone carries a dozen. Nothing checked them until `just doc` ran in CI,
# because `cargo doc` was never invoked — a broken link was silent, and silent
# rot in the docs is the specific failure `CLAUDE.md` is written against.
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_html_tags = "deny"
# Deliberately allowed. These crates are `publish = false` and their docs are
# read in this repo, where a module header that explains its own internals —
# `status_line`'s private `Row` cursor, `theme`'s `load` — is doing its job. The
# lint is aimed at published docs where such a link renders dead.
private_intra_doc_links = "allow"
redundant_explicit_links = "deny"
unescaped_backticks = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# The TUI owns the terminal: a stray print corrupts the frame. The CLI door
# (`phosphor --eval`) is the one legitimate writer and allows these locally.
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
