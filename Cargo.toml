[workspace]
members = ["crates/*"]
# The two vendored subtrees (T003, T004) are path dependencies but deliberately
# NOT members. A path dep inside the workspace dir is auto-promoted to a member
# unless excluded, and membership would put upstream code inside
# `cargo fmt --all --check` and `clippy --workspace -D warnings` — CI would then
# go red on code we did not write, and the fix would be to reformat the fork,
# which is exactly the divergence `just vendor-diff` exists to prevent.
# Excluded, they still build (as dependencies of `phosphor-buffer` / `phosphor-ui`)
# but our lints stop at the seam. `ratatui-code-editor` also carries its own
# `[workspace]` table for its examples, which would be a second workspace root.
#
# `fuzz` is excluded for the same reason at a different seam. It is a cargo-fuzz
# crate, so it needs nightly for `-Zsanitizer` while `rust-toolchain.toml` pins
# 1.97.1 for tape determinism — and a directory outside the workspace may carry
# its own `rust-toolchain.toml`, which `fuzz/` does. Excluding it also keeps a
# fuzz target out of `--workspace` builds: fuzzing is something a person runs
# deliberately, not a cost `just gate` pays on every invocation.
exclude = ["fuzz", "vendor/ratatui-code-editor", "vendor/ratatui-markdown"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
# The real floor, recomputed from the dependency graph rather than asserted.
#
# This read `1.85` — edition 2024's floor, and the fork's — from `T002` until the
# tooling pass checked it. It was false: `ratatui` 0.30.2 and the five crates
# that ship with it declare `rust-version = "1.88"`, as does `time` 0.3.55. A
# floor lower than a dependency's is not a floor, it is a claim nobody could
# build on, and nothing noticed because the toolchain is pinned to 1.97.1 for
# tape determinism and no one ever compiles at the floor.
#
# `scripts/lint-msrv.sh` recomputes this from `cargo metadata` now, so the next
# dependency that raises it fails CI instead of making this line wrong again.
rust-version = "1.88"
version = "0.1.0"

# The dependency floor (T002). Versions are SPIKES.md's manifest, verified 2026-08-11.
# Two rules this table exists to hold:
#   * `phosphor-ui` takes `ratatui-core` and never `ratatui`.
#   * `steel-core` is pinned exactly (Q5) — a patch bump is its own scheduled task.
[workspace.dependencies]
# The CLI door's argument parser (SPIKES.md's manifest, `phosphor --eval`).
# `T090` is its first consumer — `--theme <slug>` plus the file to open — and
# `T023` takes the same parser when `--eval` lands, which is why it is pinned
# here rather than in the binary's own manifest.
#
# `default-features = false` drops `color` and `suggestions`: the colour stack
# (anstream/anstyle-query/colorchoice) writes SGR to a terminal this program is
# about to take over, and `strsim`'s "did you mean" is not worth a dependency
# for a two-flag CLI. What stays is the parser, the derive macro, and legible
# errors.
#
# `string` is `T023`'s, and it is not optional there: the CLI door's 208 verbs
# are *built at runtime* by walking the registry, so every command name, flag
# name and value placeholder is an owned `String` rather than a literal. That
# feature is exactly the `impl From<String> for clap::{Str, Id}` pair, adds no
# dependency, and is what a derived door costs. Without it the alternative is
# leaking the registry's names to `&'static str`, which trades a feature flag
# for a memory leak.
clap = { version = "4.6.6", default-features = false, features = [
    "derive",
    "error-context",
    "help",
    "std",
    "string",
    "usage",
] }
crossterm = "0.29.0"
phosphor-agent = { path = "crates/phosphor-agent" }
phosphor-buffer = { path = "crates/phosphor-buffer" }
phosphor-core = { path = "crates/phosphor-core" }
phosphor-steel = { path = "crates/phosphor-steel" }
# T014's crate. Not in this table before T090 because nothing had drawn a frame
# yet; the binary is its first consumer and every later one (T026, T088) goes
# through the same `Term`.
phosphor-term = { path = "crates/phosphor-term" }
phosphor-ui = { path = "crates/phosphor-ui" }
phosphor-vcs = { path = "crates/phosphor-vcs" }
ratatui = "0.30.2"
# The two vendored forks (T003 / T004), consumed as path deps — not submodules and
# not `[patch.crates-io]` (plan §2). Provenance for each is in its own VENDOR.md.
ratatui-code-editor = { path = "vendor/ratatui-code-editor", default-features = false }
ratatui-core = "0.1.2"
ratatui-markdown = { path = "vendor/ratatui-markdown", default-features = false }
ropey = "1.6.1"
steel-core = "=0.8.2"
steel-derive = "=0.8.2"
tree-sitter = "0.26"

# One lint configuration for all seven crates, inherited via `[lints] workspace = true`,
# rather than seven `#![warn(...)]` preambles that drift (SPIKES.md, hygiene).
# The T006 / T007 structural lints get their teeth here.
[workspace.lints.rust]
missing_debug_implementations = "warn"
# `missing_docs` is deliberately NOT here yet. It is right for this workspace —
# the doc comments are load-bearing — but `just clippy` runs `-D warnings`, so
# turning it on denies rather than warns, and there are 21 undocumented struct
# fields today: 19 in `phosphor-ui/src/theme/load.rs`'s error variants and 2 in
# `buffer_view.rs`. They are `surface`'s files and `surface` is live in Window D.
# Sized here so it is a known piece of work rather than a discovery.
unreachable_pub = "warn"
unsafe_code = "deny"
unused_qualifications = "warn"

# Intra-doc links are how this codebase cross-references itself: `action.rs`'s
# header alone carries a dozen. Nothing checked them until `just doc` ran in CI,
# because `cargo doc` was never invoked — a broken link was silent, and silent
# rot in the docs is the specific failure `CLAUDE.md` is written against.
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_html_tags = "deny"
# Deliberately allowed. These crates are `publish = false` and their docs are
# read in this repo, where a module header that explains its own internals —
# `status_line`'s private `Row` cursor, `theme`'s `load` — is doing its job. The
# lint is aimed at published docs where such a link renders dead.
private_intra_doc_links = "allow"
redundant_explicit_links = "deny"
unescaped_backticks = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# The TUI owns the terminal: a stray print corrupts the frame. The CLI door
# (`phosphor --eval`) is the one legitimate writer and allows these locally.
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
