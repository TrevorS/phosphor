# Pinned for determinism, not for a version floor.
#
# The version floor is `workspace.package.rust-version = "1.85"` in Cargo.toml
# (edition 2024, which the vendored `ratatui-code-editor` fork also requires).
# This file exists for the reason SPIKES.md gives under "configuration rather
# than tools": VHS reference images (V001/V002) are only comparable if the
# binary that produced them was built by the same compiler. A floor ("1.85+")
# doesn't give you that — two machines both satisfying the floor can still
# differ in codegen, and the tapes would drift for no reason a diff explains.
#
# Pinned to the exact current stable. Not the name "stable", which moves under
# you on the next `rustup update` and so cannot give determinism at all.
#
# An earlier revision pinned 1.93.1 on the grounds that it was the only exact
# version already installed here, and that pinning 1.97.1 would force a
# download. Teej's call at the CP-0 gate was to use latest: the toolchain has
# been installed under that literal name, so the download cost is paid once per
# machine and the tapes are produced by the same compiler developers run.
# Raising this pin is a deliberate, reviewed commit — the same discipline the
# VHS reference images get, and for the same reason.
[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy"]
