# Phosphor CI (T005). Owned by `harness` (TEAM.md).
#
# Three jobs T005 asks for (fmt / clippy / test), plus the two seams this phase
# adds: `lint` (the scripts/lint-*.sh convention — see justfile's `lint` recipe;
# this is the ONLY CI edit either T006 or T007 should ever require) and `deny`
# (cargo-deny, wired as its own job per SPIKES.md's hygiene-tooling table).
#
# Every job calls a `just` recipe rather than inlining cargo invocations, so
# "does CI pass" and "does `just <recipe>` pass locally" never drift apart.
#
# This has run for real on GitHub's runners since shortly after T005 landed
# (`gh workflow view ci.yml` — nine runs as of this comment, mostly green).
# The `tapes-diff` and `features` jobs below are the two additions nothing has
# executed on a runner yet — see their own comments and each phase's report for
# exactly what was and wasn't verified.
#
# NOT here, and deliberately: coverage. `just coverage` is a measurement and the
# justfile's own comment carries the argument — a coverage floor reddens for
# reasons unrelated to correctness, so it gets lowered until it means nothing.
# Same reason `bench` has no job. `just unused-deps` is absent for a different
# reason: cargo-machete's right answer today is "yes, deliberately" for the
# placeholder crates, and a check whose findings are correct-but-not-actionable
# is one people learn to skip.

name: CI

on:
  push:
  pull_request:

# Cancel a superseded run on the same ref instead of burning runner time on
# stale pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# **Read, and said out loud.** The repository default is already read-only, but a
# default is a setting somebody can change from a web page and a workflow cannot
# see. Nothing here writes: no job pushes, comments, or releases. Declaring it
# means a job that grows a write needs an edit here, in review, rather than
# inheriting one — which matters more now that the repository is public and
# `pull_request` fires on forks.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # No explicit toolchain-install action in any job below: rust-toolchain.toml
  # pins the exact channel (1.97.1) and components (rustfmt, clippy) for
  # determinism (see that file's own comment), and GitHub's ubuntu-latest
  # runners ship rustup, which auto-installs the pinned override on the first
  # `cargo`/`rustc` invocation.
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `just` is not preinstalled on GitHub's runners (same reason the `lint`
      # job installs it). Every job that shells out to a recipe needs this.
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just fmt
        env:
          RUST_BACKTRACE: "1"

  clippy:
    name: cargo clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - run: just clippy
        env:
          RUST_BACKTRACE: "1"

  # The suite, in four slices that run at once.
  #
  # **Measured before it was changed.** The single test job was 17m12s, and the
  # build was 163s of it — the other 866s was the tests themselves, on a
  # `ubuntu-latest` box that is **2 vCPU** for a private repo. nextest defaults
  # to one thread per core, so the whole suite ran two at a time.
  #
  # Raising `--test-threads` is the obvious lever and is the wrong one here. The
  # numbers are in the justfile's `test-shard` comment: the pty suite goes
  # 146s → 74s → 46s at 2, 4 and 8 threads, and then *back up* to 52s at 12 with
  # a test failing. The harness has 30s deadlines and a starved child editor
  # blows them; flakes appeared exactly when threads exceeded logical CPUs.
  # Four 2-vCPU runners are the same parallelism with none of the starvation.
  #
  # `--partition count:k/4` is nextest's own splitter, so nothing here maintains
  # a list of which tests go where — measured at 76.5s and 75.9s for the first
  # two slices, which is as even as a hand-written split would have been on its
  # best day and cannot rot when a test file is added.
  #
  # This is where Tier 1 (docs/TASKS.md's three-tier table — the committed
  # cell-grid snapshots T018/T034/etc. add via `insta`) actually gates: no
  # `continue-on-error`, and `insta` panics on a real mismatch by default
  # (verified against insta 1.48.0's own source this session — see V008's
  # report for the exact call site). Contrast `tapes-diff` below, Tier 2,
  # which is `continue-on-error: true` by construction.
  test-shard:
    name: nextest ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      # Every slice runs even when one fails: a suite that stops at the first
      # red slice tells you less than the one that tells you all four.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      # cargo-nextest: per-test process isolation (SPIKES.md's hygiene table) —
      # tests that touch the XDG state dir and terminal state get flaky under a
      # shared-process runner otherwise.
      # Pinned to 0.9.143, matching SPIKES.md's hygiene table. The local install
      # was 0.9.135 and was upgraded to agree with the doc at the CP-0 gate,
      # rather than pinning CI to whatever happened to be on one machine.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.143
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # **No per-slice key, deliberately.** The default key is built from the
      # job id, which is `test-shard` for all four legs — so they share one
      # cache entry, which is right: `--partition` changes which tests *run*,
      # never what gets *built*, so all four compile the identical workspace.
      # Keying per slice was the first draft and would have made four ~1 GB
      # entries of the same artefacts against a 10 GB repo-wide limit that
      # evicts LRU — four jobs competing to push each other's caches out.
      # On a cold run all four miss and one wins the save; the rest are a
      # harmless "already exists".
      - uses: Swatinem/rust-cache@v2
      - run: just test-shard ${{ matrix.shard }} 4
        env:
          RUST_BACKTRACE: "1"
      # **Doctests, on one slice only.** `cargo test --doc` is a second compiler
      # invocation rather than a second test run, and running it four times
      # would pay for the rustdoc pass four times to learn the same thing.
      - if: matrix.shard == 1
        run: just test-doc
        env:
          RUST_BACKTRACE: "1"

  # The name branch protection knows, kept.
  #
  # Sharding renames a job — a matrix always suffixes — and a required check
  # that no longer exists is a required check that never runs, which reads as
  # green. This job carries the old name, does no work, and passes only if
  # every slice did.
  #
  # **`if: always()` and an explicit check, not bare `needs:`.** A dependent job
  # whose `needs` failed is *skipped*, and a skipped check is not a failed one —
  # it is a third state, and which of the two it is treated as depends on where
  # it is read. That is the same shape as the renaming trap above: a required
  # check that does not report is one nobody hears say no. So this always runs
  # and turns the slices' result into a red one itself.
  test:
    name: cargo nextest run
    runs-on: ubuntu-latest
    needs: test-shard
    if: always()
    steps:
      - name: Every slice passed, or say which state they ended in
        run: |
          set -euo pipefail
          result='${{ needs.test-shard.result }}'
          if [ "$result" != "success" ]; then
            echo "the nextest slices ended in: $result" >&2
            exit 1
          fi
          echo "all four nextest slices passed"

  lint:
    name: just lint (structural lints)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the ONE job that needs full history. `just vendor-check`
      # (reached through scripts/lint-vendor-provenance.sh) reads each fork's
      # `git-subtree-split` trailer to prove the SHA its VENDOR.md records is the
      # SHA history actually merged. The default shallow clone has no such
      # commit, so the check cannot answer its question at all — it failed here
      # the first time for exactly that reason. A lint that needs history gets
      # history; the alternative is a lint that silently skips, which is the
      # failure mode all of these exist to prevent.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # `just` itself isn't preinstalled on GitHub's runners.
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      # The whole seam: every lint is one scripts/lint-*.sh script, and
      # `just lint` runs all of them. Nobody edits this workflow to add a lint —
      # twenty exist now and not one of them changed a *step* here. (It said
      # "six" until the count was ten behind, which is the seam working and the
      # prose not: nothing recomputed a number written in a comment. Something
      # does now, and that is why the word above is the one thing a new lint
      # still has to touch — `scripts/doc_claims.py` fails until it matches.
      # T102 was the first to discover that, which is the cheaper half of the
      # trade: a one-word edit instead of a silently stale sentence.)
      - run: just lint

  deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # bans: denies a second major of ratatui/ratatui-core — the rule
      # SPIKES.md says matters most, and the one that would have caught the
      # tui-textarea / ratatui-markdown 0.29-vs-0.30 split mechanically.
      # licenses + advisories run in the same pass; see deny.toml for the
      # advisory ignores (all four are "unmaintained", not vulnerabilities,
      # transitive through steel-core =0.8.2 with no safe upgrade available).
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Does every feature combination still build?
  #
  # SPIKES.md's hygiene table has listed `cargo-hack` since M-0 for one reason —
  # Q4's guardrail, that the transcript must render with the markdown feature on
  # and off — and `vendor/ratatui-markdown/VENDOR.md` promises
  # `cargo hack --feature-powerset` is what will prove it. Nothing kept that
  # promise: the tool was not installed and no recipe named it. This job and
  # `just hack` are the promise, kept.
  #
  # THIS ONE GATES, unlike `tapes-diff` above, and the distinction is the whole
  # of `harness`'s standing rule rather than an exception to it. "Feature set X
  # does not compile" is a deterministic fact about the tree with one right
  # answer; a pixel comparison across font rendering and vhs versions is not.
  # A check that can only go red for a real defect belongs in the required set;
  # a change detector never does.
  #
  # Its own job, not a step in `test`, for the reason every job here is its own
  # job: a failure should name which check failed without reading a log. And in
  # CI rather than in `just gate` because `--each-feature` is n+2 full-workspace
  # `cargo check` passes — 15 of them today — and `gate` is run constantly by
  # people who are not touching a `[features]` table.
  #
  # Not yet executed on a GitHub runner: added in the same window as this
  # comment, and verified only by running `just hack` locally (15 combinations
  # across the 8 crates, all green, cargo-hack 0.6.45 — the version SPIKES.md
  # pins). The powerset form was run locally too, 18 combinations, also green.
  features:
    name: cargo hack (feature combinations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # taiki-e maintains both cargo-hack and install-action, so the exact pin
      # SPIKES.md records is installable as a prebuilt binary here.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack@0.6.45
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - run: just hack
        env:
          RUST_BACKTRACE: "1"

  # V008 — Tier 2 (VHS pixel diff). docs/TASKS.md's three-tier table is
  # explicit that only Tier 1 (the `test` job above, via T018's committed
  # snapshots) gates CI; Tier 2 is a change detector — "harness"'s own
  # characteristic failure (TEAM.md) is letting pixel comparison across font
  # rendering and vhs versions redden a correct build. `continue-on-error:
  # true` on the *job* is what makes that structural rather than a matter of
  # remembering it on a step: even a full job failure — a missing tool, a
  # `vhs` capture crash, an install step that can't reach an exact pin —
  # reports as a passing check and cannot fail the workflow run, so this job
  # is structurally incapable of blocking merge even if someone later adds
  # its name to a branch-protection required-checks list by mistake.
  #
  # Deliberately its own job, not a step tacked onto `test`: a flaky
  # renderer failing mid-job must never take a passing Tier-1 run down with
  # it (docs/TASKS.md's V008 acceptance line).
  tapes-diff:
    name: Tier 2 — VHS pixel diff (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      # Single source of truth for the pinned versions: read them out of
      # tapes/check-versions.sh (V001) instead of a second copy here that can
      # drift out of sync with the script that actually enforces them — the
      # exact failure mode CLAUDE.md's "the tree wins, the document is the
      # bug" rule exists to catch.
      - name: Read pinned tool versions (tapes/check-versions.sh)
        id: pins
        run: |
          set -euo pipefail
          vhs_v=$(grep -oP 'REQUIRED_VHS="\K[^"]+' tapes/check-versions.sh)
          ttyd_v=$(grep -oP 'REQUIRED_TTYD="\K[^"]+' tapes/check-versions.sh)
          echo "vhs=${vhs_v}" >> "$GITHUB_OUTPUT"
          echo "ttyd=${ttyd_v}" >> "$GITHUB_OUTPUT"

      # vhs and ttyd both publish an exact-version Linux x86_64 binary on
      # their GitHub releases (confirmed against the v0.11.0 / 1.7.7 release
      # asset lists), so both install byte-pinned, matching
      # tapes/check-versions.sh exactly.
      - name: Install vhs (pinned)
        run: |
          set -euo pipefail
          v="${{ steps.pins.outputs.vhs }}"
          curl -fsSL -o /tmp/vhs.tar.gz \
            "https://github.com/charmbracelet/vhs/releases/download/v${v}/vhs_${v}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/vhs.tar.gz -C /tmp
          install -m 0755 "/tmp/vhs_${v}_Linux_x86_64/vhs" /usr/local/bin/vhs

      - name: Install ttyd (pinned)
        run: |
          set -euo pipefail
          v="${{ steps.pins.outputs.ttyd }}"
          curl -fsSL -o /usr/local/bin/ttyd \
            "https://github.com/tsl0922/ttyd/releases/download/${v}/ttyd.x86_64"
          chmod +x /usr/local/bin/ttyd

      # ffmpeg is the one pin this step cannot guarantee: neither Ubuntu's
      # apt repo nor a static-build mirror publishes an on-demand pin as
      # specific as tapes/check-versions.sh's patch version, so this installs
      # whatever `apt-get` resolves. `just tapes-diff` will then correctly
      # refuse to run tapes against the wrong ffmpeg (V001's version gate,
      # working as designed) — a hard error this job reports and, per
      # `continue-on-error` above, never blocks on. See this phase's report
      # for what that means for how much real Tier-2 signal to expect here
      # until someone closes this gap.
      # ImageMagick alongside it, and `compare` is the whole job: without it
      # `diff-tapes.sh` exits 1 on its own tool check before capturing a single
      # frame. It did exactly that on every run this job has ever had — under a
      # second, a green tick from `continue-on-error`, and not one pixel
      # compared. A non-blocking job that cannot run is indistinguishable from
      # a non-blocking job that passes, which is what made it survive.
      - name: Install ffmpeg and ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      # The one job that builds `--release`, so it warms a cache of its own —
      # the default key includes the job id, and release artefacts share
      # nothing with the debug ones every other job builds. Uncached this was
      # a full optimised build of the whole graph on every push, which is most
      # of why a job that cannot fail the run was the second longest one in it.
      - uses: Swatinem/rust-cache@v2
      - name: Build phosphor (release) and put it on PATH
        run: |
          set -euo pipefail
          cargo build --release --bin phosphor
          mkdir -p /tmp/phosphor-bin
          ln -sf "$PWD/target/release/phosphor" /tmp/phosphor-bin/phosphor
          echo "/tmp/phosphor-bin" >> "$GITHUB_PATH"
        env:
          RUST_BACKTRACE: "1"

      # V007's diff-tapes.sh already exits 0 for any number of pixel
      # mismatches — those are findings, not failures, printed with a
      # pointer to the diff image (see tapes/README.md's V007 section). A
      # nonzero exit here means a genuine tool failure (missing binary, a
      # `vhs` capture crash, a version mismatch from the ffmpeg step above),
      # which is real signal worth a failed step — `continue-on-error` on
      # the job is what stops that from blocking merge, not silencing it
      # here.
      - name: just tapes-diff
        run: just tapes-diff 2>&1 | tee /tmp/tapes-diff.log

      - name: Post diff summary
        if: always()
        run: |
          {
            echo "## Tier 2 — VHS pixel diff (change detector, does not block merge)"
            echo
            echo '```'
            cat /tmp/tapes-diff.log 2>/dev/null || echo "(no output captured — see the job log above)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Uploaded unconditionally: a hard failure above is exactly when the
      # partial artifacts/log are most useful for diagnosing why, and
      # `if-no-files-found: ignore` means an empty _diffs/ (the common case
      # — most runs match) costs nothing.
      - name: Upload diff artifacts
        if: always()
        # v4 to v7 is three majors and none of them touches what this step
        # uses. v5 and v6 are runtime bumps to Node 24 — v6 needs runner
        # >= 2.327.1 and GitHub's hosted runners report 2.336.0 — and v7 moves
        # the action's own internals to ESM and adds an opt-in `archive: false`
        # for unzipped single-file uploads. `name` and `path` behave as before,
        # and this step sets nothing else.
        uses: actions/upload-artifact@v7
        with:
          name: tapes-diff-${{ github.sha }}
          path: |
            tapes/artifacts/_diffs/
            /tmp/tapes-diff.log
          if-no-files-found: ignore
          retention-days: 14
